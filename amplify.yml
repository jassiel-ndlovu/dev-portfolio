version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node 20+.
        - nvm use 20 || nvm install 20
        # `npm install` (not `npm ci`) tolerates lockfile drift.
        - npm install --no-audit --no-fund
    build:
      commands:
        # Static export → produces a plain `out/` folder.
        - npm run build
  artifacts:
    # Static export output. (Not a monorepo — app root is the repo root.)
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
