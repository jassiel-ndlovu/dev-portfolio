version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node 20+. Use it explicitly so Amplify's default
        # image version can't cause resolution drift.
        - nvm use 20 || nvm install 20
        # `npm install` (not `npm ci`) tolerates lockfile drift between your
        # local npm and Amplify's, which is what was breaking the build.
        - npm install --no-audit --no-fund
    build:
      commands:
        - npm run build
  artifacts:
    # Next.js build output.
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
