version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node 20+.
        - nvm use 20 || nvm install 20
        # `npm install` (not `npm ci`) tolerates lockfile drift between your
        # local npm and Amplify's.
        - npm install --no-audit --no-fund
    build:
      commands:
        - npm run build
  artifacts:
    # `.next` is emitted at the repo root — so the app root must be the repo
    # root (do NOT set a monorepo appRoot of src/app).
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
